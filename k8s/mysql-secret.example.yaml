# Create with: kubectl apply -f k8s/mysql-secret.example.yaml
# Never commit the real password. Copy to mysql-secret.yaml with real values (gitignored or kept local).
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: sample-app
type: Opaque
stringData:
  DB_USER: root
  DB_PASSWORD: change-me
