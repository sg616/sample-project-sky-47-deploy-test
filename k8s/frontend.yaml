apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sample-app
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: default-secret
      containers:
        - name: frontend
          image: swr.pk-isb-1.sky47.com/pk-beta-repo/sample-frontend:1.2.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
# No Service here on purpose. Public HTTPS 443 on the shared ELB belongs to the
# APISIX gateway (repo apigateway_setup_APISIX: k8s/gateway-lb.yaml), which routes
#   /api/* -> backend:8080, /orders-api/* -> orders-backend:8080, /* -> frontend-internal:80
# Do NOT add a LoadBalancer Service for the frontend: CCE refuses a second
# Service on port 443 of the same ELB, so the apply would fail (and the
# frontend must not bypass the gateway anyway).
