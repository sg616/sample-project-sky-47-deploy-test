# OPTIONAL — only needed if your CCE cluster uses the "Cloud Native Logging"
# (log-agent) add-on. If your cluster uses ICAgent + AOM, configure log
# collection from the console instead (see K8S-DEPLOYMENT.md section 7).
#
# Collects stdout of all containers in the sample-app namespace and ships it
# to the LTS log group/stream you created. Replace the two IDs below.
apiVersion: logging.openvessel.io/v1
kind: LogConfig
metadata:
  name: sample-app-stdout
  namespace: sample-app
spec:
  inputDetail:
    type: container_stdout
    containerStdout:
      allContainers: true
  outputDetail:
    type: LTS
    LTS:
      ltsLogGroupID: bff6e526-615e-4903-8266-da682afdb3cb
      ltsLogStreamID: 4380367a-7523-48b5-9aaf-965fd7c79c36
