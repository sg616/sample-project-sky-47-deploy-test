apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-backend
  namespace: sample-app
  labels:
    app: orders-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-backend
  template:
    metadata:
      labels:
        app: orders-backend
    spec:
      imagePullSecrets:
        - name: default-secret
      # OpenTelemetry Java agent (traces -> Tempo in ns observability). The
      # initContainer copies the jar into a shared emptyDir, so the app image is
      # unchanged. Same fields as apigateway_setup_APISIX/observability/patches/otel-java.yaml.
      initContainers:
        - name: otel-agent
          image: swr.pk-isb-1.sky47.com/pk-beta-repo/autoinstrumentation-java:2.32.0
          command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
      volumes:
        - name: otel-agent
          emptyDir: {}
      containers:
        - name: orders-backend
          image: swr.pk-isb-1.sky47.com/pk-beta-repo/sample-orders-backend:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel/javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: orders-backend
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=beta,k8s.namespace.name=sample-app"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            # Only continue traces started by the APISIX gateway (no probe noise)
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_always_off"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
            # JVM / HTTP / DB-pool metrics -> Prometheus OTLP receiver (traces still go to Tempo)
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: "http://obs-prometheus.observability.svc/api/v1/otlp/v1/metrics"
            - name: OTEL_EXPORTER_OTLP_METRICS_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "30000"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # Spring Boot log lines carry the trace id: "INFO [trace_id=...]"
            - name: LOGGING_PATTERN_LEVEL
              value: "%5p [trace_id=%X{trace_id:-}]"
            - name: APP_ENV
              value: sky47
            # Same RDS host as the catalog backend, but a DIFFERENT database (ordersdb).
            # Create it with dbscripts/003_create_orders_db.sql.
            - name: DB_HOST
              value: 10.10.1.20
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: ordersdb
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
              readOnly: true
          readinessProbe:
            httpGet:
              # App serves under context-path /orders-api
              path: /orders-api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /orders-api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  # Must stay "orders-backend": the APISIX route /orders-api/* targets it
  name: orders-backend
  namespace: sample-app
spec:
  type: ClusterIP
  selector:
    app: orders-backend
  ports:
    - port: 8080
      targetPort: 8080
