server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the catalog backend service
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy orders API calls to the second backend (separate path, separate service).
    # Public traffic now reaches the backends through the APISIX gateway routes,
    # not these blocks. They are kept so the gateway rollback (nginx back on the
    # ELB) still serves the APIs. Remove them once the gateway is permanent.
    location /orders-api/ {
        proxy_pass http://orders-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
