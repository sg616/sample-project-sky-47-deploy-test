server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA only. /api/* and /orders-api/* are routed to the backends by the
    # APISIX gateway (repo apigateway_setup_APISIX) and never reach this nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
