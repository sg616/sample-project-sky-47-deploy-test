server:
  # Override with PORT locally (e.g. 8081) when the catalog backend already uses 8080
  port: ${PORT:8080}
  servlet:
    # All endpoints live under /orders-api/ so the frontend nginx (and later
    # an API gateway) can route this service by path, separate from /api/.
    context-path: /orders-api

spring:
  application:
    name: orders-backend
  datasource:
    # Same RDS host as the catalog backend, different database (ordersdb)
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ordersdb}?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL57Dialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
